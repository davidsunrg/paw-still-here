<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d24" />
    <title>星光宠物纪念馆</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="fade"></div>

    <!-- 加载页 -->
    <div id="loader">
      <svg class="paw" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="66" rx="23" ry="18" />
        <ellipse cx="22" cy="42" rx="8" ry="11" transform="rotate(-20 22 42)" />
        <ellipse cx="40" cy="26" rx="8" ry="11" transform="rotate(-6 40 26)" />
        <ellipse cx="60" cy="26" rx="8" ry="11" transform="rotate(6 60 26)" />
        <ellipse cx="78" cy="42" rx="8" ry="11" transform="rotate(20 78 42)" />
      </svg>
      <h1 data-t="brand"></h1>
      <p class="sub" data-t="subtitle"></p>
      <div class="bar"><i id="progress"></i></div>
      <p class="step" id="load-step"></p>
      <button id="btn-enter" class="primary hidden" data-t="enter"></button>
    </div>

    <!-- 常驻界面 -->
    <div id="hud" class="hidden">
      <div class="brand">
        <svg class="paw" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="66" rx="23" ry="18" />
          <ellipse cx="22" cy="42" rx="8" ry="11" transform="rotate(-20 22 42)" />
          <ellipse cx="40" cy="26" rx="8" ry="11" transform="rotate(-6 40 26)" />
          <ellipse cx="60" cy="26" rx="8" ry="11" transform="rotate(6 60 26)" />
          <ellipse cx="78" cy="42" rx="8" ry="11" transform="rotate(20 78 42)" />
        </svg>
        <span data-t="brand"></span>
      </div>
      <div class="top-right">
        <button id="btn-sound"></button>
        <button id="btn-quality"></button>
        <button id="btn-solo"></button>
        <button id="btn-help" data-t="help"></button>
      </div>
      <div class="bottom-bar">
        <div class="group">
          <button data-tp="gate" data-t="tpGate"></button>
          <button data-tp="river" data-t="tpRiver"></button>
          <button data-tp="fire" data-t="tpFire"></button>
          <button data-tp="hall" data-t="tpHall"></button>
          <button data-tp="memorial" data-t="tpMemorial"></button>
        </div>
        <button id="btn-search" data-t="search"></button>
        <button id="btn-lantern" class="primary" data-t="lantern"></button>
      </div>
      <div id="hint"></div>
      <div id="stick-zone"></div>
      <div id="joystick"><i id="stick"></i></div>
    </div>
    <div id="tooltip"></div>
    <div id="toast"></div>

    <!-- 宠物的小院：一侧的资料，下方的礼物栏 -->
    <aside id="detail">
      <button class="close" id="detail-close" aria-label="close">×</button>
      <h2 id="detail-name"></h2>
      <p class="meta" id="detail-meta"></p>
      <p class="meta" id="detail-dates"></p>
      <blockquote id="detail-message"></blockquote>
      <div class="rites" id="detail-rites">
        <button id="btn-rite-river" data-t="riteRiver"></button>
        <button id="btn-rite-fire" data-t="riteFire"></button>
        <button id="btn-leave" data-t="spaceLeave"></button>
      </div>
    </aside>

    <div id="shrine-bar">
      <button data-offer="flower">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14.5V22M12 19c-2.2 0-3.6-1-4.2-2.6M12 18c1.8 0 3-.8 3.6-2" />
          <circle cx="12" cy="4.8" r="2.5" /><circle cx="16" cy="7.7" r="2.5" /><circle cx="14.5" cy="12.3" r="2.5" />
          <circle cx="9.5" cy="12.3" r="2.5" /><circle cx="8" cy="7.7" r="2.5" /><circle cx="12" cy="9" r="1.6" />
        </svg>
        <span data-t="giftFlower"></span><b></b>
      </button>
      <button data-offer="candle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5c1.7 2 2.4 3.3 2.4 4.5a2.4 2.4 0 0 1-4.8 0c0-1.2.7-2.5 2.4-4.5z" />
          <rect x="9" y="11" width="6" height="10.5" rx="1" /><path d="M12 9.4V11" />
        </svg>
        <span data-t="giftCandle"></span><b></b>
      </button>
      <button data-offer="snack">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.2 9.6a2.4 2.4 0 1 0-3.4 2.4 2.4 2.4 0 1 0 3.4 2.4h7.6a2.4 2.4 0 1 0 3.4-2.4 2.4 2.4 0 1 0-3.4-2.4z" />
        </svg>
        <span data-t="giftSnack"></span><b></b>
      </button>
      <button data-offer="toy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" /><path d="M5.2 7c3 1.6 4.6 4.6 4.3 9.2M18.8 17c-3-1.6-4.6-4.6-4.3-9.2" />
        </svg>
        <span data-t="giftToy"></span><b></b>
      </button>
      <button data-offer="letter">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5.5" width="18" height="13" rx="1.5" /><path d="M3.5 6.5 12 13l8.5-6.5" />
        </svg>
        <span data-t="giftLetter"></span><b></b>
      </button>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="modal-lantern">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="lanternTitle"></h2>
        <p data-t="lanternDesc"></p>
        <form id="lantern-form">
          <input id="lantern-input" maxlength="24" autocomplete="off" />
          <button class="primary" data-t="lanternGo"></button>
        </form>
      </div>
    </div>

    <div class="modal" id="modal-letter">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 id="letter-title"></h2>
        <ul class="messages" id="letter-list"></ul>
        <form id="letter-form" class="stack">
          <textarea id="letter-input" maxlength="300" rows="4"></textarea>
          <button class="primary" data-t="letterSend"></button>
        </form>
      </div>
    </div>

    <div class="modal" id="modal-river">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="riverTitle"></h2>
        <p data-t="riverDesc"></p>
        <div class="chosen hidden" id="river-chosen">
          <span id="river-chosen-name"></span>
          <button id="river-change" data-t="riverChange"></button>
        </div>
        <div class="picker" id="river-picker">
          <input id="river-search" autocomplete="off" />
          <ul class="results" id="river-results"></ul>
        </div>
        <button class="primary go" id="river-go" data-t="riverGo" disabled></button>
      </div>
    </div>

    <div class="modal" id="modal-fire">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="fireTitle"></h2>
        <p data-t="fireDesc"></p>
        <div class="chosen hidden" id="fire-chosen">
          <span id="fire-chosen-name"></span>
          <button id="fire-change" data-t="riverChange"></button>
        </div>
        <div class="picker" id="fire-picker">
          <input id="fire-search" autocomplete="off" />
          <ul class="results" id="fire-results"></ul>
        </div>
        <textarea id="fire-input" maxlength="300" rows="4"></textarea>
        <p class="note" data-t="fireNote"></p>
        <button class="primary go" id="fire-go" data-t="fireGo" disabled></button>
      </div>
    </div>

    <div class="modal" id="modal-guestbook">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="guestbookTitle"></h2>
        <ul class="messages" id="guestbook-list"></ul>
        <form id="guestbook-form">
          <input id="guestbook-input" maxlength="80" autocomplete="off" />
          <button class="primary" data-t="guestbookSend"></button>
        </form>
      </div>
    </div>

    <div class="modal" id="modal-search">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="searchTitle"></h2>
        <input id="search-input" autocomplete="off" />
        <ul class="results" id="search-results"></ul>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
