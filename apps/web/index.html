<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d24" />
    <!-- title、description、分享卡片和 canonical 在打包时从语言文件写进来，见 vite.config.ts -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0d24'/%3E%3Cg fill='%23f2b56b' transform='translate(11 13) scale(.78)'%3E%3Cellipse cx='50' cy='66' rx='23' ry='18'/%3E%3Cellipse cx='22' cy='42' rx='8' ry='11' transform='rotate(-20 22 42)'/%3E%3Cellipse cx='40' cy='26' rx='8' ry='11' transform='rotate(-6 40 26)'/%3E%3Cellipse cx='60' cy='26' rx='8' ry='11' transform='rotate(6 60 26)'/%3E%3Cellipse cx='78' cy='42' rx='8' ry='11' transform='rotate(20 78 42)'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- 首屏：style.css 随 JS 才注入，避免 FOUC（白底大黑爪） -->
    <style>
      :root {
        --warm-soft: #ffe2b8;
        --ink-dim: rgba(245, 236, 223, 0.66);
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --tracking: 0.2;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d24;
        color: #f5ecdf;
        font-family: var(--sans);
        font-size: 14px;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
      }
      .hidden {
        display: none !important;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(ellipse at 50% 30%, #1d2050 0%, #0b0d24 62%);
        text-align: center;
        padding: 24px;
      }
      #loader .paw {
        width: 72px;
        height: 72px;
        fill: #ffc47a;
      }
      #loader h1 {
        margin: 10px 0 0;
        padding-left: calc(0.22em * var(--tracking));
        font-family: var(--serif);
        font-size: 34px;
        font-weight: 600;
        letter-spacing: calc(0.22em * var(--tracking));
        color: var(--warm-soft);
      }
      #loader .sub {
        margin: 0 0 14px;
        padding-left: calc(0.3em * var(--tracking));
        max-width: min(520px, 86vw);
        font-size: 14px;
        line-height: 1.5;
        text-wrap: balance;
        font-family: var(--serif);
        letter-spacing: calc(0.3em * var(--tracking));
        color: var(--ink-dim);
      }
      .loader-action {
        position: relative;
        flex-shrink: 0;
        width: min(260px, 70vw);
        height: 52px;
      }
      #loader .bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #loader.ready .bar {
        visibility: hidden;
      }
      #loader .bar i {
        display: block;
        height: 100%;
        width: 0;
      }
      #btn-enter {
        position: absolute;
        left: 50%;
        top: 50%;
        margin: 0;
        padding: 12px 34px;
        padding-left: calc(34px + 0.2em * var(--tracking));
        font-size: 16px;
        font-weight: 600;
        letter-spacing: calc(0.2em * var(--tracking));
        transform: translate(-50%, -50%);
        white-space: nowrap;
        color: #3b2410;
        background: linear-gradient(180deg, #ffd69a, #f2a955);
        border: none;
        border-radius: 999px;
      }
      @media (max-width: 520px) {
        #loader h1 {
          font-size: 26px;
        }
      }
      #loader .site {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(22px + env(safe-area-inset-bottom));
        margin: 0;
        font-size: 12px;
        opacity: 0.75;
        color: rgba(245, 236, 223, 0.66);
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="fade"></div>

    <!-- 加载页 -->
    <div id="loader">
      <svg class="paw" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="66" rx="23" ry="18" />
        <ellipse cx="22" cy="42" rx="8" ry="11" transform="rotate(-20 22 42)" />
        <ellipse cx="40" cy="26" rx="8" ry="11" transform="rotate(-6 40 26)" />
        <ellipse cx="60" cy="26" rx="8" ry="11" transform="rotate(6 60 26)" />
        <ellipse cx="78" cy="42" rx="8" ry="11" transform="rotate(20 78 42)" />
      </svg>
      <h1 data-t="brand">Paw Still Here</h1>
      <p class="sub" data-t="tagline">As long as they're remembered, they're still with us.</p>
      <div class="loader-action">
        <div class="bar"><i id="progress"></i></div>
        <button id="btn-enter" class="primary hidden" type="button" data-t="enter">Enter</button>
      </div>
      <p class="site" data-t="site">pawstillhere.com</p>
    </div>

    <!-- 常驻界面 -->
    <div id="hud" class="hidden">
      <div class="brand">
        <svg class="paw" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="66" rx="23" ry="18" />
          <ellipse cx="22" cy="42" rx="8" ry="11" transform="rotate(-20 22 42)" />
          <ellipse cx="40" cy="26" rx="8" ry="11" transform="rotate(-6 40 26)" />
          <ellipse cx="60" cy="26" rx="8" ry="11" transform="rotate(6 60 26)" />
          <ellipse cx="78" cy="42" rx="8" ry="11" transform="rotate(20 78 42)" />
        </svg>
        <span data-t="brand"></span>
      </div>
      <div class="top-right">
        <button id="btn-add-pet" class="primary hidden" type="button" data-t="addPet"></button>
        <button id="btn-my-pets" class="hidden" type="button" data-t="myPets"></button>
        <button id="btn-floor" class="hidden" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="floor-pop"></button>
        <button id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-pop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
        <div id="floor-pop" class="menu-pop hidden">
          <span class="floor-title" data-t="floorsTitle"></span>
          <div id="floor-list"></div>
        </div>
        <!-- 不常用的设置收在这里 -->
        <div id="menu-pop" class="menu-pop hidden">
          <button id="btn-sound" type="button"></button>
          <button id="btn-quality" type="button"></button>
          <button id="btn-solo" type="button"></button>
          <button id="btn-help" type="button" data-t="help"></button>
        </div>
      </div>
      <!-- 还没有自己的宠物时出现一次的小卡片 -->
      <div id="invite-card" class="hidden">
        <p data-t="inviteText"></p>
        <button id="invite-go" class="primary" type="button" data-t="addPet"></button>
        <button id="invite-close" type="button">×</button>
      </div>
      <div class="bottom-bar">
        <div class="group">
          <button data-tp="gate" data-t="tpGate"></button>
          <button data-tp="river" data-t="tpDock"></button>
          <button data-tp="fire" data-t="tpFire"></button>
          <button data-tp="lantern" data-t="tpLantern"></button>
          <button data-tp="hall" data-t="tpHall"></button>
        </div>
        <button id="btn-letters" data-t="letters"></button>
      </div>
      <div id="hint"></div>
      <div id="stick-zone"></div>
      <div id="joystick"><i id="stick"></i></div>
    </div>
    <div id="tooltip"></div>
    <div id="toast"></div>

    <!-- 单宠物视角：顶部的资料，左上角的返回，下方的礼物栏，右侧的相册 -->
    <div id="shrine-shade"></div>
    <button id="btn-leave"><i aria-hidden="true">‹</i><span data-t="shrineLeave"></span></button>
    <aside id="detail">
      <h2 id="detail-name"></h2>
      <p class="meta" id="detail-meta"></p>
      <p class="meta" id="detail-address"></p>
      <blockquote id="detail-message"></blockquote>
      <!-- 去放河灯、去烧信、读信：入口先收起来，不展示 -->
      <div class="rites" id="detail-rites" hidden>
        <button id="btn-rite-river" data-t="riteRiver"></button>
        <button id="btn-rite-fire" data-t="riteFire"></button>
        <button id="btn-rite-letters" data-t="riteLetters"></button>
      </div>
    </aside>
    <!-- 纪念角左上角、返回按钮旁：分享对所有人可见，编辑只给创建者 -->
    <div class="memorial-manage" id="detail-manage">
      <button type="button" class="secondary hidden" id="memorial-share" data-t="share"></button>
      <button type="button" class="secondary hidden" id="memorial-edit" data-t="memorialEdit"></button>
    </div>

    <div id="ride-bar">
      <button id="btn-ride-lantern" data-t="tipDock"></button>
      <button id="btn-ride-leave" data-t="rideLeave"></button>
    </div>

    <div id="shrine-bar">
      <button data-offer="flower">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14.5V22M12 19c-2.2 0-3.6-1-4.2-2.6M12 18c1.8 0 3-.8 3.6-2" />
          <circle cx="12" cy="4.8" r="2.5" /><circle cx="16" cy="7.7" r="2.5" /><circle cx="14.5" cy="12.3" r="2.5" />
          <circle cx="9.5" cy="12.3" r="2.5" /><circle cx="8" cy="7.7" r="2.5" /><circle cx="12" cy="9" r="1.6" />
        </svg>
        <span data-t="giftFlower"></span><b></b>
      </button>
      <button data-offer="candle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5c1.7 2 2.4 3.3 2.4 4.5a2.4 2.4 0 0 1-4.8 0c0-1.2.7-2.5 2.4-4.5z" />
          <rect x="9" y="11" width="6" height="10.5" rx="1" /><path d="M12 9.4V11" />
        </svg>
        <span data-t="giftCandle"></span><b></b>
      </button>
      <button data-offer="snack">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.2 9.6a2.4 2.4 0 1 0-3.4 2.4 2.4 2.4 0 1 0 3.4 2.4h7.6a2.4 2.4 0 1 0 3.4-2.4 2.4 2.4 0 1 0-3.4-2.4z" />
        </svg>
        <span data-t="giftSnack"></span><b></b>
      </button>
      <button data-offer="toy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" /><path d="M5.2 7c3 1.6 4.6 4.6 4.3 9.2M18.8 17c-3-1.6-4.6-4.6-4.3-9.2" />
        </svg>
        <span data-t="giftToy"></span><b></b>
      </button>
      <button data-offer="letter">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5.5" width="18" height="13" rx="1.5" /><path d="M3.5 6.5 12 13l8.5-6.5" />
        </svg>
        <span data-t="giftLetter"></span><b></b>
      </button>
    </div>
    <!-- 相册：右侧一列缩略图，点开是大图 -->
    <div id="album"></div>

    <!-- 弹窗 -->
    <div class="modal" id="modal-lantern">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="lanternTitle"></h2>
        <p class="lore" data-t="lanternLore"></p>
        <p data-t="lanternDesc"></p>
        <form id="lantern-form">
          <input id="lantern-input" maxlength="24" autocomplete="off" />
        </form>
        <div class="chosen hidden" id="lantern-chosen">
          <span id="lantern-chosen-name"></span>
          <button id="lantern-change" data-t="riverChange"></button>
        </div>
        <div class="picker" id="lantern-picker">
          <input id="lantern-search" autocomplete="off" />
          <ul class="results" id="lantern-results"></ul>
        </div>
        <button class="primary go" id="lantern-go" form="lantern-form" data-t="lanternGo"></button>
      </div>
    </div>

    <!-- 信：读树上所有的信（或者只看写给某一只的），也可以写一封 -->
    <div class="modal" id="modal-letters">
      <div class="card wide">
        <button class="close" data-close aria-label="close">×</button>
        <h2 id="letters-title"></h2>
        <p id="letters-desc" data-t="lettersDesc"></p>
        <div class="tabs">
          <button type="button" id="letters-all" data-t="lettersAll"></button>
          <button type="button" id="letters-pet" class="hidden"></button>
          <button type="button" id="letters-mine" data-t="letterMine"></button>
          <button type="button" id="post-open" data-t="letterWrite"></button>
        </div>
        <form id="post-form" class="stack hidden">
          <textarea id="post-input" maxlength="300" rows="3"></textarea>
          <div class="chosen hidden" id="post-chosen">
            <span id="post-chosen-name"></span>
            <button type="button" id="post-change" data-t="riverChange"></button>
          </div>
          <div class="picker" id="post-picker">
            <input id="post-search" autocomplete="off" />
            <ul class="results" id="post-results"></ul>
          </div>
          <button class="primary" id="post-go" data-t="letterSend"></button>
        </form>
        <ul class="messages letters" id="letters-list"></ul>
      </div>
    </div>

    <div class="modal" id="modal-river">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="riverTitle"></h2>
        <p class="lore" data-t="riverLore"></p>
        <p data-t="riverDesc"></p>
        <div class="chosen hidden" id="river-chosen">
          <span id="river-chosen-name"></span>
          <button id="river-change" data-t="riverChange"></button>
        </div>
        <div class="picker" id="river-picker">
          <input id="river-search" autocomplete="off" />
          <ul class="results" id="river-results"></ul>
        </div>
        <button class="primary go" id="river-go" data-t="riverGo"></button>
      </div>
    </div>

    <div class="modal" id="modal-fire">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="fireTitle"></h2>
        <p class="lore" data-t="fireLore"></p>
        <p data-t="fireDesc"></p>
        <div class="chosen hidden" id="fire-chosen">
          <span id="fire-chosen-name"></span>
          <button id="fire-change" data-t="riverChange"></button>
        </div>
        <div class="picker" id="fire-picker">
          <input id="fire-search" autocomplete="off" />
          <ul class="results" id="fire-results"></ul>
        </div>
        <textarea id="fire-input" maxlength="300" rows="4"></textarea>
        <p class="note" data-t="fireNote"></p>
        <button class="primary go" id="fire-go" data-t="fireGo" disabled></button>
      </div>
    </div>

    <div class="modal" id="modal-photos">
      <button class="close" data-close aria-label="close">×</button>
      <button class="photo-nav" id="photo-prev">‹</button>
      <img id="photo-view" alt="" draggable="false" />
      <button class="photo-nav" id="photo-next">›</button>
      <div id="photo-count"></div>
    </div>
    <div class="modal" id="modal-search">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 data-t="myPetsTitle"></h2>
        <p id="my-pets-empty" class="hidden" data-t="myPetsEmpty"></p>
        <ul class="results" id="your-results"></ul>
        <button type="button" class="primary hidden" id="btn-create-memorial" data-t="addPet"></button>
      </div>
    </div>

    <!-- 分享：把这只宠物的链接发给别人，或者存一张图 -->
    <div class="modal" id="modal-share">
      <div class="card">
        <button class="close" data-close aria-label="close">×</button>
        <h2 id="share-title"></h2>
        <p id="share-desc"></p>
        <div class="share-link">
          <input id="share-url" readonly />
          <button type="button" id="share-copy" data-t="shareCopy"></button>
        </div>
        <button type="button" class="primary" id="share-send" data-t="shareSend"></button>
        <button type="button" id="share-image" data-t="shareImage"></button>
        <p class="note hidden" id="share-note"></p>
      </div>
    </div>

    <div class="modal" id="modal-memorial">
      <div class="card memorial-card" id="memorial-card"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
